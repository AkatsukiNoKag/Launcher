name: Build and Release Launcher

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build .NET Framework 4.8
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build WinForms application
        run: msbuild Launcher.sln /m /t:Rebuild /p:Configuration=Release /p:Platform="Any CPU" /verbosity:minimal
      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./publish | Out-Null
          Copy-Item -Path ./bin/Release/* -Destination ./publish -Recurse -Force
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-build
          path: ./publish
          if-no-files-found: error
      - name: Package release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path ./publish/* -DestinationPath ./Release.zip
      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Release.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
